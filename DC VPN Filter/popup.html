<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>DC VPN Filter</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-width: 240px;
      padding: 12px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    input[type="checkbox"] {
      transform: scale(1.2);
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>
  <label>
    <input type="checkbox" id="enabled">
    <span>VPN 차단</span>
  </label>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
